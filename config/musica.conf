# ======================================================================
# Musica Configuration File
# Location: /opt/Musica/config/musica.conf
# Purpose : Defines environment variables for all Musica CLI utilities
# Shell   : C-shell compatible (csh/tcsh)
# ======================================================================

# ----------------------------------------------------------------------
# BASE DIRECTORY
# ----------------------------------------------------------------------
# The installer sets this to the absolute installation path.
# Default for manual installs:
setenv MUSICA_BASE_DIR /opt/Musica

# ----------------------------------------------------------------------
# CORE DIRECTORY STRUCTURE
# ----------------------------------------------------------------------
setenv MUSICA_BIN_DIR         $MUSICA_BASE_DIR/bin
setenv MUSICA_CONFIG_DIR      $MUSICA_BASE_DIR/config
setenv MUSICA_DOCS_DIR        $MUSICA_BASE_DIR/docs
setenv MUSICA_SQL_DIR         $MUSICA_BASE_DIR/sql
setenv MUSICA_TOOLS_DIR       $MUSICA_BASE_DIR/tools

# ----------------------------------------------------------------------
# DATA DIRECTORIES
# ----------------------------------------------------------------------
setenv MUSICA_DATA_DIR        $MUSICA_BASE_DIR/data
setenv MUSICA_IMPORT_DIR      $MUSICA_DATA_DIR/imports
setenv MUSICA_EXPORT_DIR      $MUSICA_DATA_DIR/exports

# ----------------------------------------------------------------------
# LOGGING
# ----------------------------------------------------------------------
setenv MUSICA_LOG_DIR         $MUSICA_BASE_DIR/logs
setenv MUSICA_LOG_FILE        $MUSICA_LOG_DIR/musica.log

# ----------------------------------------------------------------------
# DATABASE SETTINGS
# ----------------------------------------------------------------------
# MUSICA_DB_TYPE: mariadb | mysql | sqlite  (sqlite support pending)
setenv MUSICA_DB_TYPE         mariadb

# Primary database name
setenv MUSICA_DB_NAME         Musica

# User/password (blank means unix_socket authentication)
setenv MUSICA_DB_USER         musica
setenv MUSICA_DB_PASS         ""

# Host/port for MariaDB/MySQL
setenv MUSICA_DB_HOST         localhost
setenv MUSICA_DB_PORT         3306

# ----------------------------------------------------------------------
# DEFAULT IMPORT/EXPORT FILENAMES
# ----------------------------------------------------------------------
setenv MUSICA_DEFAULT_IMPORT  musica_import.csv
setenv MUSICA_DEFAULT_EXPORT  musica_export.csv

# ----------------------------------------------------------------------
# BEHAVIOR FLAGS
# ----------------------------------------------------------------------
# Debug/verbose mode (0=off, 1=on)
setenv MUSICA_DEBUG           0

# Auto-archive imported CSV files (0=no, 1=yes)
setenv MUSICA_ARCHIVE_IMPORT  1

# ======================================================================
# END OF CONFIGURATION
# ======================================================================

